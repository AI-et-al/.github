<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--head-->
<title>tokenograph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--line:#222228;--text:#d9d9de;--dim:#8f8f98;--faint:#5a5a64;--track:#18181d;
  --working:#17b36b;--blocked:#f04a4a;--done:#2f8ff5;--idle:#5a5a64;--unknown:#8f8f98;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;--pixel:"Silkscreen","Press Start 2P",var(--mono)}
html{color-scheme:dark;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 var(--mono);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:1500px;margin:0 auto;padding:44px 48px 56px}
.logo{width:56px;height:56px;display:block;margin-bottom:28px}
h1{font:400 28px/1.25 var(--pixel);margin:0 0 10px;color:#ececf1}
.sub{color:var(--dim);font-size:12px;line-height:1.7}
.sub b{color:var(--text);font-weight:500}
.summary{display:flex;gap:22px;flex-wrap:wrap;margin:26px 0 18px;font-size:14px}
.summary .k{color:var(--dim)} .summary .v{color:#eaeaef;margin-left:8px}
.pill{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.working{color:var(--working);border-color:var(--working)}
.pill.blocked{color:var(--blocked);border-color:var(--blocked);background:rgba(240,74,74,.08)}
.pill.done{color:var(--done);border-color:var(--done)}
.pill.idle{color:var(--idle)}
.pill.herdr{margin-left:6px;border-style:dashed}
.tblwrap{overflow-x:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:1100px}
th{color:var(--faint);font-weight:500;text-align:right;padding:10px 8px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td{padding:9px 8px;border-top:1px solid #17171b;text-align:right;white-space:nowrap;vertical-align:top}
td.l{white-space:normal}
td .title{color:#eaeaef;font-weight:500}
td .meta{color:var(--dim);font-size:11.5px;margin-top:2px}
td a{color:#cfd8ff;text-decoration:none;border-bottom:1px dotted var(--faint)}
td a:hover{border-bottom-style:solid}
.ring{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:6px}
.snap{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 6px}
.spin{width:12px;height:12px;border-radius:50%;border:2px dashed var(--dim);display:inline-block;animation:spin 1.4s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--line);margin-top:22px;padding-top:14px;color:var(--faint);font-size:11.5px;line-height:1.7}
footer b{color:var(--dim);font-weight:500}
@media (max-width:820px){.wrap{padding:26px 18px 40px}h1{font-size:20px}}
</style>
<!--/head-->
</head>
<body>
<!--body-->
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="0" y="0" width="1" height="8" fill="#fff"/><rect x="1" y="0" width="4" height="1" fill="#fff"/>
      <rect x="4" y="1" width="1" height="3" fill="#fff"/><rect x="1" y="3" width="3" height="1" fill="#fff"/>
      <rect x="6" y="6" width="2" height="2" fill="#fff"/>
    </svg>
    <h1>fleet</h1>
    <div class="sub" id="subtitle"></div>
  </header>
  <div class="summary" id="summary"></div>
  <div class="tblwrap"><table id="tbl"></table></div>
  <footer id="foot"></footer>
</div>
<script id="tokenograph-data" type="application/json">__TOKENOGRAPH_DATA__</script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
let D = JSON.parse($('tokenograph-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
function fmtDur(s) { if (s == null) return '–'; if (s < 60) return Math.round(s) + 's'; if (s < 3600) return `${Math.floor(s / 60)}m${pad2(Math.round(s % 60))}s`; return `${Math.floor(s / 3600)}h${pad2(Math.floor((s % 3600) / 60))}m`; }
function fmtAgo(s) { if (s < 60) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return (s / 3600).toFixed(1) + ' h ago'; return Math.round(s / 86400) + ' d ago'; }
function fmtTok(n) { n = +n || 0; if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e5) return Math.round(n / 1e3) + 'k'; if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k'; return String(Math.round(n)); }
const ORDER = { blocked: 0, done: 1, working: 2, idle: 3, unknown: 4 };
function ring(pct) { const R = 5, c = 2 * Math.PI * R, p = Math.min(1, pct || 0); return `<svg class="ring" viewBox="0 0 14 14"><circle cx="7" cy="7" r="${R}" fill="none" stroke="#2a2a31" stroke-width="2.5"/><circle cx="7" cy="7" r="${R}" fill="none" stroke="${p > .85 ? '#f04a4a' : '#2f8ff5'}" stroke-width="2.5" stroke-dasharray="${(p * c).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 7 7)"/></svg>`; }
function render() {
  const rows = D.rows.slice().sort((a, b) => (ORDER[(a.herdr && a.herdr.status) || a.state] ?? 9) - (ORDER[(b.herdr && b.herdr.status) || b.state] ?? 9) || b.last_activity - a.last_activity);
  const counts = {}; for (const r of rows) { const s = (r.herdr && r.herdr.status) || r.state; counts[s] = (counts[s] || 0) + 1; }
  const cost = rows.reduce((a, r) => a + (r.cost ?? r.cost_reported ?? 0), 0), anyCost = rows.some(r => r.cost != null || r.cost_reported != null);
  const live = D.live ? '<span class="spin" title="live"></span>' : '<span class="snap">snapshot</span>';
  $('subtitle').innerHTML = `${rows.length} sessions · Claude Code <b>${esc(D.sources.claude)}</b> · pi <b>${esc(D.sources.pi)}</b> · herdr ${D.herdr_servers.length ? '<b>' + esc(D.herdr_servers.join(', ')) + '</b>' : '<b>not reachable</b> (states below are read from the transcripts)'} ${live}`;
  $('summary').innerHTML = ['blocked', 'done', 'working', 'idle'].map(s => `<span><span class="pill ${s}">${s}</span><span class="v">${counts[s] || 0}</span></span>`).join('') +
    `<span><span class="k">computed tokens</span><span class="v">${fmtTok(rows.reduce((a, r) => a + r.computed, 0))}</span></span>` +
    `<span><span class="k">from cache</span><span class="v">${fmtTok(rows.reduce((a, r) => a + r.cached, 0))}</span></span>` +
    (anyCost ? `<span><span class="k">est. cost</span><span class="v">$${cost.toFixed(2)}</span></span>` : '');
  const html = ['<tr><th class="l">state</th><th class="l">session</th><th class="l">agent</th><th>laps</th><th>wall</th><th>context</th><th>computed</th><th>cached</th><th>output</th><th>cost</th><th>last activity</th></tr>'];
  rows.forEach((r, i) => {
    const h = r.herdr;
    const state = `<span class="pill ${r.state}" title="from the transcript">${r.state}</span>` + (h ? `<span class="pill herdr ${h.status}" title="reported by herdr · pane ${esc(h.pane_id)}${h.name ? ' · ' + esc(h.name) : ''}">herdr: ${esc(h.status)}</span>` : '');
    const hint = r.state === 'blocked' && r.blocked_hint ? `waiting on ${esc(r.blocked_hint)}` : (r.state === 'done' ? 'turn finished, waiting for you' : '');
    const link = D.live ? `<a href="s/${i}/" title="open the session panel">${esc(r.title)}</a>` : esc(r.title);
    html.push(`<tr><td class="l">${state}${hint ? `<div class="meta">${hint}</div>` : ''}</td>
      <td class="l"><div class="title">${link}</div><div class="meta">${esc(r.cwd || '')}${r.branch ? ' · ' + esc(r.branch) : ''} · ${esc((r.session_id || '').slice(0, 8))}</div></td>
      <td class="l">${esc(r.fmt === 'pi' ? 'pi' : 'claude code')}<div class="meta">${esc((r.models || []).join(', '))}</div></td>
      <td>${r.laps}</td><td>${fmtDur(r.wall_s)}</td>
      <td>${ring(r.context_pct)}${r.context_pct == null ? '–' : Math.round(r.context_pct * 100) + '%'}<div class="meta">${fmtTok(r.context_used)}</div></td>
      <td>${fmtTok(r.computed)}</td><td>${fmtTok(r.cached)}</td><td>${fmtTok(r.completion)}</td>
      <td>${r.cost != null ? '~$' + r.cost.toFixed(2) : (r.cost_reported != null ? '$' + r.cost_reported.toFixed(2) : '–')}</td>
      <td>${fmtAgo(r.age_s)}<div class="meta">${new Date(r.last_activity * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div></td></tr>`);
  });
  $('tbl').innerHTML = html.join('');
  $('foot').innerHTML = `<b>states</b> follow herdr’s vocabulary: working (the agent is producing or running a tool), blocked (a tool call has waited more than 20 s for a result, usually a permission prompt or a question), done (the turn ended and nobody has prompted since), idle (no activity for a while). When herdr is running, its own detection is shown next to the transcript-derived state and drives the ordering. · generated ${new Date(D.generated_at).toLocaleString()} · tokenograph ${esc(D.tokenograph)}`;
}
function poll() {
  fetch('fleet.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => { D = d; render(); }).catch(() => {});
}
render();
if (D.live) setInterval(poll, Math.max(2000, D.poll_ms || 5000));
})();
</script>
<!--/body-->
</body>
</html>
