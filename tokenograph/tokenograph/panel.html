<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--head-->
<title>tokenograph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d;--line:#222228;--text:#d9d9de;--dim:#8f8f98;--faint:#5a5a64;--track:#18181d;
  --prefill:#2f8ff5;--reasoning:#7ee3b8;--generation:#17b36b;--tool:#f5a623;--tool2:#e0641a;
  --compaction:#9b5cf6;--idle:#2c2c33;--overhead:#3a3a44;--err:#f04a4a;--interrupt:#f0c34a;--cached:#9a9aa3;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --pixel:"Silkscreen","Press Start 2P",var(--mono);
}
html{color-scheme:dark;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 var(--mono);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:1500px;margin:0 auto;padding:44px 48px 56px}
header{margin-bottom:22px}
.logo{width:56px;height:56px;display:block;margin-bottom:28px}
h1{font:400 28px/1.25 var(--pixel);letter-spacing:.01em;margin:0 0 10px;color:#ececf1;word-break:break-word}
.sub{color:var(--dim);font-size:12px;line-height:1.7}
.sub b{color:var(--text);font-weight:500}
.card{border-top:1px solid var(--line);padding:10px 0 16px}
.card-head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:8px 0;font-size:16px;color:#e4e4e9}
.card-head .chev{display:inline-block;color:var(--dim);transition:transform .15s;width:14px;text-align:center}
.card.collapsed .chev{transform:rotate(-90deg)}
.card.collapsed .card-body{display:none}
.card-head .ico{color:var(--dim);font-size:15px;width:18px;text-align:center}
.card-head .spacer{flex:1}
.card-head .meta{font-size:15px;color:var(--text);display:flex;align-items:center;gap:8px}
.ring{width:22px;height:22px;display:inline-block;vertical-align:middle}
.spin{width:16px;height:16px;border-radius:50%;border:2px dashed var(--dim);display:inline-block;animation:spin 1.4s linear infinite;margin-left:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.snap{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-left:4px}
.card-body{padding-top:6px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;column-gap:36px;row-gap:2px;font-size:15px}
.stats .h{grid-column:1/-1;color:var(--dim);font-size:12px;letter-spacing:.08em;margin:12px 0 2px}
.stats .h:first-child{margin-top:0}
.kv{display:flex;align-items:baseline;gap:8px;padding:2px 0}
.kv .k{color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:8px}
.kv .k.ind{padding-left:18px}
.kv .v{margin-left:auto;font-variant-numeric:tabular-nums;color:#eaeaef;white-space:nowrap}
.kv .v.est{cursor:help}
.kv .v.est::before{content:"~";color:var(--faint);margin-right:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.hollow{background:transparent!important;border:1.5px solid currentColor;width:7px;height:7px}
.tot{display:none}

/* activity */
.act-head{display:flex;align-items:baseline;gap:14px;margin:8px 0 14px;font-size:15px}
.act-head .lbl{color:var(--dim)}
.act-head .sum{margin-left:auto;color:var(--dim);font-size:14px;white-space:nowrap}
.act-head .sum b{color:var(--text);font-weight:500}
.act-head button{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--dim);border-radius:3px;padding:1px 8px;cursor:pointer;margin-left:10px}
.act-head button:hover{color:var(--text);border-color:var(--dim)}
.chart{display:grid;grid-template-columns:210px minmax(300px,1fr) 64px;column-gap:16px;position:relative}
.labels{position:relative}
.labels .row,.rights .row{height:30px;display:flex;align-items:center;justify-content:flex-end;color:var(--dim);white-space:nowrap;font-size:13.5px}
.labels .row.strong{color:#eaeaef;font-weight:600}
.labels .row.group{color:#eaeaef;font-weight:600}
.labels .row.ind{padding-right:14px}
.labels .row span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.labels .bracket{position:absolute;left:2px;width:7px;border:1px solid var(--faint);border-right:none;pointer-events:none}
.rights .row{justify-content:flex-end;color:var(--dim);font-variant-numeric:tabular-nums}
.cwrap{position:relative;min-width:0}
canvas{display:block;width:100%}
.sel{position:absolute;top:0;bottom:34px;background:rgba(47,143,245,.14);border-left:1px solid var(--prefill);border-right:1px solid var(--prefill);pointer-events:none}
.tip{position:fixed;z-index:50;background:#141418;border:1px solid #2c2c33;border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.55;max-width:460px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5);color:var(--text)}
.tip .t{font-weight:600;color:#fff;margin-bottom:2px}
.tip .m{color:var(--dim)}
.tip code{font:inherit;color:#cfd8ff;word-break:break-all;white-space:pre-wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--dim);font-size:12px;margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px}

/* cost block */
.stats .h.cost{margin-top:14px}

/* context card */
.ctx-chart{position:relative;margin:4px 0 14px}
.ctx-chart canvas{display:block;width:100%}
.ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 34px;margin-top:6px}
.ctx-grid h3{font-size:12px;letter-spacing:.08em;color:var(--dim);font-weight:500;margin:0 0 8px;text-transform:uppercase}
.ctx-grid h3 span{color:var(--faint);text-transform:none;letter-spacing:0;margin-left:8px}
table.ledger{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.ledger th{color:var(--faint);font-weight:500;text-align:right;padding:2px 6px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
table.ledger th:first-child,table.ledger td:first-child{text-align:left;padding-left:0}
table.ledger td{padding:4px 6px;border-top:1px solid #17171b;vertical-align:top;text-align:right;white-space:nowrap}
table.ledger td.lab{white-space:normal;text-align:left;max-width:280px}
table.ledger tr.grp td.lab{cursor:pointer}
table.ledger tr.grp td.lab::before{content:"▸ ";color:var(--faint)}
table.ledger tr.grp.open td.lab::before{content:"▾ "}
table.ledger tr.sub td{border-top:none;color:var(--dim);padding-top:1px;padding-bottom:1px;font-size:12px}
table.ledger tr.sub td.lab{padding-left:18px}
table.ledger .bar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle;margin-right:6px;min-width:1px}
table.ledger .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:middle}
.ctx-block{margin-top:22px}
.ctx-block h3{font-size:12px;letter-spacing:.08em;color:var(--dim);font-weight:500;margin:0 0 8px;text-transform:uppercase}
.ev{display:flex;gap:12px;padding:6px 0;border-top:1px solid #17171b;font-size:12.5px;align-items:baseline}
.ev .when{color:var(--dim);white-space:nowrap}
.ev .big{color:#f0c34a;white-space:nowrap}
.ev .cause{color:var(--text)}
.verdict{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px}
.verdict b{color:#fff;font-weight:600}
.ctx-notes{color:var(--faint);font-size:11.5px;line-height:1.7;margin-top:18px}
.ctx-notes b{color:var(--dim);font-weight:500}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--dim);margin-left:8px;vertical-align:middle}
@media (max-width:820px){.ctx-grid{grid-template-columns:1fr}}

footer{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;color:var(--faint);font-size:11.5px;line-height:1.7}
footer b{color:var(--dim);font-weight:500}
@media (max-width:820px){
  .wrap{padding:26px 18px 40px}
  .stats{grid-template-columns:1fr}
  .chart{grid-template-columns:120px minmax(200px,1fr) 52px;column-gap:10px}
  .labels .row,.rights .row{font-size:12px}
  h1{font-size:20px}
}
</style>
<!--/head-->
</head>
<body>
<!--body-->
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="0" y="0" width="1" height="8" fill="#fff"/><rect x="1" y="0" width="4" height="1" fill="#fff"/>
      <rect x="4" y="1" width="1" height="3" fill="#fff"/><rect x="1" y="3" width="3" height="1" fill="#fff"/>
      <rect x="6" y="6" width="2" height="2" fill="#fff"/>
    </svg>
    <h1 id="title">tokenograph</h1>
    <div class="sub" id="subtitle"></div>
  </header>

  <section class="card" id="card-stats">
    <div class="card-head" data-toggle>
      <span class="chev">⌄</span><span class="ico">◔</span><span>Stats</span>
      <span class="spacer"></span>
      <span class="meta"><svg class="ring" viewBox="0 0 22 22" id="ring"></svg><span id="ctx-pct" title="context window fill of the latest request">–</span><span id="live-ind"></span></span>
    </div>
    <div class="card-body"><div class="stats" id="stats"></div></div>
  </section>

  <section class="card" id="card-activity">
    <div class="card-head" data-toggle>
      <span class="chev">⌄</span><span class="ico">≡</span><span>Activity</span>
      <span class="spacer"></span>
      <span class="meta" id="act-count"></span>
    </div>
    <div class="card-body">
      <div class="act-head"><span class="lbl">activity</span><span class="sum" id="act-sum"></span></div>
      <div class="chart">
        <div class="labels" id="labels"></div>
        <div class="cwrap" id="cwrap"><canvas id="cv"></canvas><div class="sel" id="sel" hidden></div></div>
        <div class="rights" id="rights"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </section>


  <section class="card" id="card-context">
    <div class="card-head" data-toggle>
      <span class="chev">⌄</span><span class="ico">▤</span><span>Context</span>
      <span class="spacer"></span>
      <span class="meta" id="ctx-meta"></span>
    </div>
    <div class="card-body">
      <div class="act-head"><span class="lbl">context window, request by request</span><span class="sum" id="ctx-sum"></span></div>
      <div class="ctx-chart"><canvas id="cv2"></canvas></div>
      <div class="ctx-grid">
        <div><h3>in the window <span id="ctx-now-title"></span></h3><table class="ledger" id="ctx-now"></table></div>
        <div><h3>what each category cost <span id="ctx-cum-title"></span></h3><table class="ledger" id="ctx-cum"></table></div>
      </div>
      <div class="ctx-block" id="ctx-history"></div>
      <div class="ctx-block" id="ctx-events"></div>
      <div class="ctx-block" id="ctx-tools"></div>
      <div class="ctx-notes" id="ctx-notes"></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>
<div id="tip" class="tip" hidden></div>
<script id="tokenograph-data" type="application/json">__TOKENOGRAPH_DATA__</script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const C = {
  prefill:'#2f8ff5', reasoning:'#7ee3b8', generation:'#17b36b', tool:'#f5a623', tool2:'#e0641a',
  compaction:'#9b5cf6', idle:'#2c2c33', overhead:'#3a3a44', err:'#f04a4a', interrupt:'#f0c34a',
  track:'#18181d', lapA:'#2a2a31', lapB:'#3a3a43', text:'#d9d9de', dim:'#8f8f98', faint:'#5a5a64'
};
const PITCH = 30, BAR = 14, AXIS_H = 34, MIN_W = 1.2;
let D = JSON.parse($('tokenograph-data').textContent);
let rows = [], view = null, hover = null, dragging = null;
const cv = $('cv'), ctx = cv.getContext('2d'), cwrap = $('cwrap'), tip = $('tip');

/* ---------- formatting ---------- */
const pad2 = n => String(n).padStart(2, '0');
function fmtDur(s) {
  if (s == null) return '–';
  if (s < 60) return s.toFixed(1) + 's';
  if (s < 3600) return `${Math.floor(s / 60)}m${pad2(Math.round(s % 60))}s`;
  return `${Math.floor(s / 3600)}h${pad2(Math.floor((s % 3600) / 60))}m`;
}
function fmtH(s) {
  if (s == null) return '–';
  if (s >= 3600) return (s / 3600).toFixed(1) + 'h';
  if (s >= 60) return Math.round(s / 60) + 'm';
  return Math.round(s) + 's';
}
function fmtTok(n) {
  n = +n || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e5) return Math.round(n / 1e3) + 'k';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(Math.round(n));
}
const fmtInt = n => (n == null ? '–' : Math.round(n).toLocaleString('en-US'));
const abs = t => new Date((D.base + t) * 1000);
const fmtClock = t => abs(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtClockS = t => abs(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- header + stats ---------- */
function renderHeader() {
  const m = D.meta;
  $('title').textContent = m.title || 'tokenograph';
  document.title = (m.title ? m.title.slice(0, 60) + ' · ' : '') + 'tokenograph';
  const bits = [];
  if (m.agent) bits.push(`<b>${esc(m.agent)}</b>`);
  if (m.session_id) bits.push(`session <b>${esc(m.session_id.slice(0, 8))}</b>`);
  if (m.models && m.models.length) bits.push(`model <b>${esc(m.models.join(', '))}</b>`);
  if (m.cwd) bits.push(`cwd <b>${esc(m.cwd)}</b>`);
  if (m.git_branch) bits.push(`branch <b>${esc(m.git_branch)}</b>`);
  if (m.cli_version) bits.push(`Claude Code <b>${esc(m.cli_version)}</b>`);
  if (m.subagent_streams) bits.push(`subagents <b>${m.subagent_streams}</b>`);
  $('subtitle').innerHTML = bits.join(' · ');
}

function kv(k, v, opts = {}) {
  const dot = opts.color ? `<span class="dot${opts.hollow ? ' hollow' : ''}" style="background:${opts.color};color:${opts.color}"></span>` : '';
  const title = opts.title ? ` title="${esc(opts.title)}"` : '';
  return `<div class="kv"><span class="k${opts.color ? '' : ' ind'}"${title}>${dot}${esc(k)}</span><span class="v${opts.est ? ' est' : ''}"${opts.est ? ' title="estimated (see footer)"' : ''}>${v}</span></div>`;
}

function renderStats() {
  const s = D.stats, t = s.time, k = s.tokens, est = !!D.meta.estimates.decode_tok_s;
  const html = [
    kv('tg/s', s.tg_s == null ? '–' : Math.round(s.tg_s), { est, title: 'completion tokens per second of decode time (reasoning + generation)' }),
    kv('pp/s', s.pp_s == null ? '–' : Math.round(s.pp_s), { est, title: 'computed prompt tokens per second of prefill time' }),
    kv('laps', fmtInt(s.laps), { title: 'one lap per user prompt' }),
    kv('avg/lap', fmtDur(s.avg_lap_s), { title: 'mean time from one prompt to the next' }),
    '<div class="h">TIME</div>',
    kv('wall clock', fmtDur(t.wall), { title: 'first to last timestamp in the transcript' }),
    kv('prefill', fmtDur(t.prefill), { color: C.prefill, est, title: 'time between sending a request and the first generated token, summed' }),
    kv('decode', fmtDur(t.decode), { color: C.generation, est, title: 'reasoning + generation: time spent producing completion tokens' }),
    kv('reasoning', fmtDur(t.reasoning), { color: C.reasoning, hollow: true, est, title: 'decode time attributed to thinking blocks' }),
    kv('tools', fmtDur(t.tools), { color: C.tool, title: `wall-clock time where a tool ran and no model call was streaming (tool durations summed: ${fmtDur(t.tools_sum)})` }),
    kv('generation', fmtDur(t.generation), { color: C.generation, est, title: 'decode time attributed to visible text and tool calls' }),
    kv('idle', fmtDur(t.idle), { title: `waiting for the user ${fmtDur(t.idle_wait)} · overhead ${fmtDur(t.idle_overhead)}` }),
    kv('compaction', fmtDur(t.compaction), { color: C.compaction, title: 'context compaction (summary generation) time' }),
    '<div class="h">TOKENS</div>',
    kv('total', fmtTok(k.total), { title: 'computed prompt + cached prompt + completion' }),
    kv('prompt, cached', fmtTok(k.prompt_cached), { color: '#9a9aa3', title: `served from the prompt cache (${k.cache_hit_ratio == null ? '–' : Math.round(k.cache_hit_ratio * 100) + '% of prompt tokens'})` }),
    kv('prompt, computed', fmtTok(k.prompt_computed), { color: C.prefill, title: `uncached input tokens, of which ${fmtTok(k.prompt_cache_write)} were written to the cache` }),
    kv('prompt, tool results', fmtTok(k.tool_results_est), { color: C.tool, est: true, title: 'tool result text at ~4 characters per token' }),
    kv('completion', fmtTok(k.completion), { color: C.generation, title: 'output tokens, including thinking' }),
    kv('reasoning', fmtTok(k.reasoning), { color: C.reasoning, hollow: true, est: D.meta.estimates.reasoning_tokens !== 'reported', title: 'thinking tokens (' + D.meta.estimates.reasoning_tokens + ')' }),
  ];
  const cost = s.cost;
  if (cost) {
    const p = cost.pricing;
    html.push('<div class="h cost">COST <span class="pill" title="' + esc(`${p.model}: $${p.in}/M in, $${p.out}/M out, cache read ×${p.read_mult}, cache write ×${p.write_5m_mult} (5m) / ×${p.write_1h_mult} (1h) · ${p.source}`) + '">' + esc(p.source) + '</span></div>');
    html.push(kv('total', '$' + cost.total.toFixed(2), { est: true, title: 'input + cache writes + cache reads + output at the pricing shown' }));
    html.push(kv('output', '$' + cost.output.toFixed(2), { color: C.generation, est: true, title: 'completion tokens × output price' }));
    html.push(kv('cache writes', '$' + cost.cache_write.toFixed(2), { color: C.prefill, est: true, title: 'computed prompt tokens written to the cache, at the write premium' }));
    html.push(kv('cache reads', '$' + cost.cache_read.toFixed(2), { color: '#9a9aa3', est: true, title: 'prompt tokens served from the cache, at the read discount' }));
    if (s.cost_reported != null) html.push(kv('reported by pi', '$' + s.cost_reported.toFixed(2), { title: 'cost as recorded by pi in the session file' }));
  } else if (s.cost_reported != null) {
    html.push('<div class="h cost">COST</div>');
    html.push(kv('reported by pi', '$' + s.cost_reported.toFixed(2), { title: 'cost as recorded by pi in the session file' }));
  }
  $('stats').innerHTML = html.join('');

  const c = s.context, pct = c.pct == null ? 0 : Math.min(1, c.pct);
  const R = 8, circ = 2 * Math.PI * R;
  $('ring').innerHTML = `<circle cx="11" cy="11" r="${R}" fill="none" stroke="#2a2a31" stroke-width="3"/>` +
    `<circle cx="11" cy="11" r="${R}" fill="none" stroke="${pct > .85 ? C.err : C.prefill}" stroke-width="3" stroke-dasharray="${(pct * circ).toFixed(2)} ${circ.toFixed(2)}" transform="rotate(-90 11 11)"/>`;
  $('ctx-pct').textContent = c.pct == null ? '–' : Math.round(c.pct * 100) + '%';
  $('ctx-pct').title = `context: ${fmtTok(c.used)} of ${fmtTok(c.window)} tokens in the latest request`;
  $('live-ind').innerHTML = D.meta.live ? '<span class="spin" title="live: following the transcript"></span>' : '<span class="snap" title="static snapshot">snapshot</span>';
  $('act-count').textContent = fmtInt(s.counts.calls);
}

/* ---------- rows ---------- */
function buildRows() {
  const calls = D.calls;
  const models = calls.filter(c => c.k === 'm'), tools = calls.filter(c => c.k === 't'), comps = calls.filter(c => c.k === 'c');
  const marks = calls.filter(c => c.k === 'x' || c.k === 'e');
  const R = [];
  const all = [];
  for (const t of tools) all.push({ t0: t.t0, t1: t.t1, color: C.tool, c: t });
  for (const m of models) {
    all.push({ t0: m.t0, t1: m.p[0], color: C.prefill, c: m, ph: 'prefill' });
    all.push({ t0: m.p[0], t1: m.p[1], color: C.reasoning, c: m, ph: 'reasoning' });
    all.push({ t0: m.p[1], t1: m.t1, color: C.generation, c: m, ph: 'generation' });
  }
  for (const c of comps) all.push({ t0: c.t0, t1: c.t1, color: C.compaction, c });
  R.push({ id: 'all', label: 'All activity', strong: true, spans: all.filter(s => s.t1 > s.t0), right: '' });
  R.push({ id: 'laps', label: 'laps', laps: true, spans: D.laps.map(l => ({ t0: l.t0, t1: l.t1, lap: l })), right: fmtInt(D.laps.length) });
  R.push({ id: 'assistant', label: 'assistant', group: true, right: fmtInt(models.length) });
  const st = D.stats.time;
  R.push({ id: 'prefill', label: 'prefill', ind: true, color: C.prefill, spans: models.filter(m => m.p[0] > m.t0).map(m => ({ t0: m.t0, t1: m.p[0], c: m, ph: 'prefill' })), right: fmtH(st.prefill) });
  R.push({ id: 'reasoning', label: 'reasoning', ind: true, color: C.reasoning, spans: models.filter(m => m.p[1] > m.p[0]).map(m => ({ t0: m.p[0], t1: m.p[1], c: m, ph: 'reasoning' })), right: fmtH(st.reasoning) });

  const L = D.ledger, rows = L.cum.rows, rd = L.read_mult;
  const eff = r => r.computed + rd * r.cached, maxE = Math.max(...rows.map(eff), 1), totE = rows.reduce((a, r) => a + eff(r), 0);
  $('ctx-cum-title').textContent = `over ${L.cum.requests} requests · ${fmtTok(L.cum.computed)} computed · ${fmtTok(L.cum.cached)} from cache`;
  const hasCost = rows.some(r => r.cost != null);
  const html = [`<tr><th>category</th><th title="tokens computed (uncached input + cache writes) across all requests">computed</th><th title="tokens served from the prompt cache across all requests">cached</th><th title="computed + cache-read-weighted cached (×${rd})">share</th>${hasCost ? '<th>cost</th>' : ''}</tr>`];
  rows.forEach((r, i) => {
    html.push(`<tr class="grp${r.subs ? '' : ' leaf'}" data-i="${i}"><td class="lab"><span class="sw" style="background:${groupColor(r.key)}"></span>${esc(r.label)}</td><td>${fmtTok(r.computed)}</td><td>${fmtTok(r.cached)}</td><td><span class="bar" style="width:${Math.round(eff(r) / maxE * 60)}px;background:${groupColor(r.key)}"></span>${totE ? (eff(r) / totE * 100).toFixed(1) + '%' : '–'}</td>${hasCost ? `<td>${r.cost == null ? '–' : '$' + r.cost.toFixed(2)}</td>` : ''}</tr>`);
    for (const sub of (r.subs || [])) html.push(`<tr class="sub" data-p="${i}" hidden><td class="lab">${esc(sub.label)}</td><td>${fmtTok(sub.computed)}</td><td>${fmtTok(sub.cached)}</td><td></td>${hasCost ? `<td>${sub.cost == null ? '–' : '$' + sub.cost.toFixed(2)}</td>` : ''}</tr>`);
  });
  $('ctx-cum').innerHTML = html.join('');
}
function renderHistory() {
  const L = D.ledger, H = L.history, el = $('ctx-history');
  if (!H) { el.innerHTML = ''; return; }
  const share = H.now_share == null ? '–' : Math.round(H.now_share * 100) + '%';
  el.innerHTML = `<h3>re-sent history</h3><div class="verdict">${share} of the current window (${fmtTok(H.now)} tokens) is conversation content that entered more than ${H.k} requests ago and is still being sent with every request. Over the session that content was re-sent ${fmtTok(H.resent_tokens)} token-times${H.cost != null ? ', about $' + H.cost.toFixed(2) + ' at cache-read prices' : ''}. A harness that distilled history into verified state deltas instead of replaying it would not pay this; whether the agent still needs it is not observable from the transcript.</div>`;
}
function renderEvents() {
  const L = D.ledger, el = $('ctx-events');
  if (!L.events.length) { el.innerHTML = '<h3>cache rebuilds</h3><div class="verdict" style="color:var(--dim)">none: every request after the first reused the cached prefix.</div>'; return; }
  el.innerHTML = '<h3>cache rebuilds · ' + L.events.length + '</h3>' + L.events.map(e =>
    `<div class="ev"><span class="when">${fmtClockS(e.t)} · request ${e.k + 1}</span><span class="big">${fmtTok(e.recomputed)} tokens recomputed</span><span class="cause">${esc(e.cause)}${e.extra_cost != null ? ` · ~$${e.extra_cost.toFixed(2)} more than a cache hit` : ''} · ${fmtTok(e.expected)} were cached before</span></div>`).join('');
}
function renderTools() {
  const L = D.ledger, T = L.tools, el = $('ctx-tools');
  if (!T) { el.innerHTML = ''; return; }
  const rd = L.read_mult, R = T.requests;
  const loadedDelta = T.loaded_direct_eff - T.loaded_deferred_eff, unloadedDelta = T.unloaded_direct_eff - T.unloaded_deferred_eff;
  const net = loadedDelta + unloadedDelta;
  el.innerHTML = `<h3>tool loading · deferred vs. direct</h3>
    <div class="verdict">${T.deferred_count} tools were deferred behind a ${fmtTok(T.listing_tokens)}-token name list; ${T.loaded.length} were loaded by ${T.searches} ToolSearch call${T.searches === 1 ? '' : 's'}, ${T.unloaded_count} never were.
    Over ${R} requests, with cache reads weighted ×${rd}: loading the ${T.loaded.length} used tools on demand cost <b>${fmtTok(T.loaded_deferred_eff)}</b> effective tokens vs <b>${fmtTok(T.loaded_direct_eff)}</b> if they had been in every request from the start (${loadedDelta >= 0 ? 'deferral saved' : 'deferral cost'} ${fmtTok(Math.abs(loadedDelta))});
    keeping the ${T.unloaded_count} unused tools out of the prompt saved <b>${fmtTok(unloadedDelta)}</b> (their schemas taken as ~${fmtTok(T.avg_schema)} tokens each, the average of the loaded ones).
    Net: <b>${net >= 0 ? 'deferral saved ' : 'direct loading would have saved '}${fmtTok(Math.abs(net))} effective tokens</b> this session.</div>
    <table class="ledger"><tr><th>tool</th><th>schema</th><th>loaded at</th><th>re-sent in</th><th title="a search that had the request to itself costs a round trip: its output plus the next request's newly computed input">search overhead</th><th>deferred</th><th>direct</th></tr>` +
    T.loaded.map(t => `<tr><td class="lab">${esc(t.name)}</td><td>${fmtTok(t.schema)}</td><td>request ${t.loaded_at}</td><td>${t.requests_after} req</td><td>${t.solo ? fmtTok(t.overhead_tokens) + ' tok · ' + fmtDur(t.overhead_s) + ' · own round trip' : fmtTok(t.overhead_tokens) + ' tok · batched with other calls'}</td><td>${fmtTok(t.deferred_eff)}</td><td>${fmtTok(t.direct_eff)}</td></tr>`).join('') + '</table>';
}
function renderCtxNotes() {
  const L = D.ledger, p = D.stats.cost && D.stats.cost.pricing;
  const bits = [`<b>how</b> the window at each request is rebuilt from the transcript: the recorded system prompt, every injected reminder and listing, prompts, assistant text, tool inputs, tool results, images, loaded skills and on-demand tool schemas; thinking is kept while the turn continues. Text is converted at ${L.cpt} chars/token for tool traffic and ${L.cpt_prose} for prose${L.calibrated ? ', calibrated on this session’s warm-cache requests' : ' (defaults)'}`,
    L.tool_block_hint ? `the built-in tool block is ${fmtTok(L.tool_block_hint)} tokens, inferred from what stayed cached through a system-prompt rebuild` : `tool schemas for built-in tools are not recorded, so they show up in “tool schemas & unmeasured”`,
    L.reconciled ? `${L.reconciled} request${L.reconciled === 1 ? '' : 's'} where the estimate exceeded the measured window were scaled to fit` : null,
    `images at ~(w×h)/750 tokens after the model’s downscale`,
    p ? `cost at $${p.in}/M input, $${p.out}/M output, cache reads ×${p.read_mult}, cache writes ×${p.write_5m_mult} (5 min) / ×${p.write_1h_mult} (1 h), pricing ${p.source}; per-category cost splits each request’s bill by the tokens each category contributed` : `no pricing known for this model: pass --price IN,OUT to cost it`];
  $('ctx-notes').innerHTML = bits.filter(Boolean).join(' · ');
}
function renderContext() {
  const card = $('card-context');
  if (!ctxAvailable()) { card.hidden = true; return; }
  card.hidden = false;
  const L = D.ledger, last = L.series[L.series.length - 1];
  const acc = L.now.rows.filter(r => r.key !== 'residual').reduce((a, r) => a + r.tokens, 0);
  $('ctx-meta').innerHTML = `${fmtTok(last.m)} in window · <span title="share of the measured window the ledger attributes to something">${last.m ? Math.round(acc / last.m * 100) : 0}% attributed</span>`;
  $('ctx-sum').innerHTML = `<b>${L.series.length} requests</b> · peak ${fmtTok(Math.max(...L.series.map(s => s.m)))} · ${L.events.length} cache rebuild${L.events.length === 1 ? '' : 's'} · click a bar to inspect`;
  if (ctxSel != null && ctxSel >= L.series.length) ctxSel = null;
  drawCtx(); renderNow(ctxSel); renderCum(); renderHistory(); renderEvents(); renderTools(); renderCtxNotes();
}
function wireCtx() {
  cv2.addEventListener('mousemove', e => {
    if (!ctxAvailable()) return;
    const r = cv2.getBoundingClientRect(), k = ctxIndexAt(e.clientX - r.left);
    if (k !== ctxHover) { ctxHover = k; drawCtx(); }
    if (k == null) { tip.hidden = true; return; }
    const s = D.ledger.series[k], top = GORDER.filter(g => s.g[g]).sort((a, b) => s.g[b] - s.g[a]).slice(0, 5);
    tip.innerHTML = `<div class="t">request ${k + 1} · ${fmtClockS(s.t)}</div><div class="m">${fmtTok(s.m)} in window · ${fmtTok(s.in + s.cc)} computed · ${fmtTok(s.cr)} cached</div>` + top.map(g => `<div class="m"><span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${groupColor(g)};margin-right:6px"></span>${GLABEL[g]} ${fmtTok(s.g[g])}</div>`).join('');
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let tx = e.clientX + 14, ty = e.clientY + 14;
    if (tx + tw > window.innerWidth - 8) tx = e.clientX - tw - 12;
    if (ty + th > window.innerHeight - 8) ty = e.clientY - th - 12;
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
  });
  cv2.addEventListener('mouseleave', () => { ctxHover = null; tip.hidden = true; if (ctxAvailable()) drawCtx(); });
  cv2.addEventListener('click', e => { if (!ctxAvailable()) return; const r = cv2.getBoundingClientRect(), k = ctxIndexAt(e.clientX - r.left); ctxSel = (k === ctxSel) ? null : k; drawCtx(); renderNow(ctxSel); });
  for (const id of ['ctx-now', 'ctx-cum']) $(id).addEventListener('click', e => {
    const tr = e.target.closest('tr.grp'); if (!tr || tr.classList.contains('leaf')) return;
    tr.classList.toggle('open'); const i = tr.dataset.i;
    $(id).querySelectorAll(`tr.sub[data-p="${i}"]`).forEach(x => { x.hidden = !tr.classList.contains('open'); });
  });
}

function renderAll(keepView) {
  renderHeader(); renderStats(); rows = buildRows(); renderRowLabels(); renderLegend(); renderFooter(); renderContext();
  if (!keepView || !view) view = [0, D.end]; else view = [Math.max(0, view[0]), Math.min(D.end, view[1])];
  $('act-sum').innerHTML = summaryHtml();
  draw();
}

/* ---------- live polling ---------- */
function poll() {
  fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
    const zoomed = view && (view[0] > 0.001 || view[1] < D.end - 0.001);
    D = d; renderAll(zoomed);
  }).catch(() => { $('live-ind').innerHTML = '<span class="snap" title="lost the server; showing the last snapshot">offline</span>'; });
}

renderAll(false);
wire(); wireCtx();
if (D.meta.live) setInterval(poll, Math.max(1000, D.meta.poll_ms || 2500));
window.__tokenograph = { get data() { return D; }, get rows() { return rows; }, get view() { return view; }, setView, draw };
})();
</script>
<!--/body-->
