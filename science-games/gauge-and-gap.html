<title>Gauge &amp; Gap</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;600&display=swap">
<style>
/* Layout: chalkboard / graph-paper lab notebook. Sticky HUD, board left and lesson card right, stacking to one column at phone width. */
:root{
  --bg:#f3efe4; --grid:rgba(60,72,60,.13); --fg:#262a27; --muted:#636a62;
  --panel:#fbf9f3; --panel-2:#ebe6d8; --line:#cfc8b5; --line-2:#b9b19b;
  --accent:#c0412a; --accent-ink:#ffffff; --accent-soft:rgba(192,65,42,.12);
  --energy:#5f7f00; --energy-soft:rgba(95,127,0,.18);
  --link:#1d6693; --link-soft:rgba(29,102,147,.14);
  --good:#2a7a4a; --bad:#ad3528; --warn:#9a6b00;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 28px rgba(50,45,30,.10);
  --font-display:"Spectral",Georgia,"Times New Roman",serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f221c; --grid:rgba(240,240,228,.06); --fg:#f1efe6; --muted:#a4b1a7;
    --panel:#163029; --panel-2:#1d3a32; --line:#2c4a41; --line-2:#3c6055;
    --accent:#ff6b4a; --accent-ink:#1a0d08; --accent-soft:rgba(255,107,74,.16);
    --energy:#d9f25e; --energy-soft:rgba(217,242,94,.16);
    --link:#8fd3ff; --link-soft:rgba(143,211,255,.14);
    --good:#7fd79c; --bad:#ff8f7e; --warn:#f0c454;
    --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f221c; --grid:rgba(240,240,228,.06); --fg:#f1efe6; --muted:#a4b1a7;
  --panel:#163029; --panel-2:#1d3a32; --line:#2c4a41; --line-2:#3c6055;
  --accent:#ff6b4a; --accent-ink:#1a0d08; --accent-soft:rgba(255,107,74,.16);
  --energy:#d9f25e; --energy-soft:rgba(217,242,94,.16);
  --link:#8fd3ff; --link-soft:rgba(143,211,255,.14);
  --good:#7fd79c; --bad:#ff8f7e; --warn:#f0c454;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background-color:var(--bg); color:var(--fg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; background-position:0 0;
  font-family:var(--font-body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.app{
  max-width:1120px; margin-inline:auto; min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 32px;
}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,5vw,3.4rem)}
h2{font-size:clamp(1.4rem,3vw,1.9rem)}
h3{font-size:1.15rem}
p{margin:0}
a{color:var(--link)}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.energy{color:var(--energy)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.6rem 1.05rem;border-radius:var(--radius);border:1.5px solid var(--line-2);
  background:var(--panel);cursor:pointer;font-weight:700;font-size:.95rem;line-height:1.2;
  transition:transform .08s ease,background .12s ease,border-color .12s ease;
  min-height:42px;
}
.btn:hover{border-color:var(--fg)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,button:focus-visible,[tabindex]:focus-visible,details summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:.35rem .7rem;min-height:34px;font-size:.85rem}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* HUD */
.hud{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;
  padding:.6rem 0 .5rem;background:var(--bg);
  border-bottom:1.5px solid var(--line);margin-bottom:1rem;
}
.hud .title{font-family:var(--font-display);font-weight:700;font-size:1.15rem;min-width:0;flex:1 1 180px}
.hud .title small{display:block;font-family:var(--font-body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font-family:var(--font-mono);font-size:.8rem;padding:.25rem .55rem;border:1px solid var(--line);border-radius:999px;background:var(--panel);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent)}
.hud .tools{display:flex;gap:.4rem;flex-wrap:wrap}
.progress{height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden;flex:1 0 100%}
.progress > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

/* title screen */
.title-screen{display:grid;gap:1.6rem;padding-block:3rem 2rem;max-width:720px}
.title-screen .promise{font-size:1.15rem;max-width:60ch}
.title-screen ul{margin:0;padding-left:1.1rem;display:grid;gap:.3rem;max-width:62ch}
.lattice-hero{width:100%;max-width:560px;aspect-ratio:3/1.2;display:block}
.board-note{font-size:.85rem;color:var(--muted)}

/* map */
.map{display:grid;gap:1.2rem;padding-block:1rem}
.map-path{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.node{
  display:grid;gap:.3rem;text-align:left;padding:.8rem .9rem;border:1.5px solid var(--line);border-radius:var(--radius);
  background:var(--panel);cursor:pointer;position:relative;min-height:112px;
}
.node:hover{border-color:var(--accent)}
.node .num{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
.node .name{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.node .topic{font-size:.8rem;color:var(--muted)}
.node .stars{font-family:var(--font-mono);font-size:.85rem;color:var(--warn);letter-spacing:.1em}
.node.locked{opacity:.55}
.node.done{border-color:var(--good)}
.node.boss{border-style:double;border-width:3px}

/* level layout */
.level{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.2rem;align-items:start}
@media (max-width:860px){.level{grid-template-columns:1fr}}
.board{display:grid;gap:.8rem;min-width:0}
.board canvas{display:block;width:100%;height:auto;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel);touch-action:none;max-width:100%}
.side{display:grid;gap:.9rem;min-width:0}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:1rem 1.05rem;box-shadow:var(--shadow);display:grid;gap:.55rem}
.card .goal{border-left:3px solid var(--accent);padding-left:.7rem;font-weight:700}
.card .goal.done{border-color:var(--good)}
details.deeper{border:1.5px dashed var(--line);border-radius:var(--radius);padding:.6rem .9rem}
details.deeper summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.deeper summary::after{content:"+";font-family:var(--font-mono);color:var(--accent)}
details.deeper[open] summary::after{content:"\2212"}
details.deeper .body{display:grid;gap:.6rem;padding-top:.6rem;max-width:62ch;font-size:.95rem}
.controls{display:grid;gap:.6rem;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:.8rem .9rem}
.controls .row{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
.controls label{display:flex;align-items:center;gap:.5rem;font-size:.9rem;min-width:0}
.controls input[type=range]{width:160px;max-width:40vw;accent-color:var(--accent)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.5rem}
.readout{background:var(--panel-2);border-radius:var(--radius);padding:.5rem .65rem;min-width:0}
.readout .k{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.readout .v{font-family:var(--font-mono);font-size:1.05rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.status{font-size:.92rem;min-height:1.4em}
.status.good{color:var(--good)} .status.bad{color:var(--bad)}
table.data{width:100%;border-collapse:collapse;font-size:.85rem;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.data th,table.data td{text-align:right;padding:.3rem .4rem;border-bottom:1px solid var(--line)}
table.data th:first-child,table.data td:first-child{text-align:left}
.table-wrap{overflow-x:auto}

/* quick check & overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,20,16,.55);display:grid;place-items:center;padding:16px}
.dialog{background:var(--panel);border:1.5px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:1.2rem 1.25rem;display:grid;gap:.9rem}
.dialog .q{font-family:var(--font-display);font-size:1.2rem;font-weight:700}
.options{display:grid;gap:.5rem}
.opt{text-align:left;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel-2);cursor:pointer;font-size:.95rem}
.opt:hover{border-color:var(--fg)}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.opt[disabled]{cursor:default}
.feedback{font-size:.95rem;min-height:1.5em}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.dialog .count{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}

/* drawer */
.drawer{position:fixed;top:env(safe-area-inset-top,0px);right:0;bottom:0;z-index:45;width:min(520px,100%);background:var(--panel);border-left:1.5px solid var(--line-2);box-shadow:var(--shadow);display:grid;grid-template-rows:auto auto 1fr;padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-bottom:1.5px solid var(--line)}
.tabs{display:flex;gap:.3rem;padding:.6rem 1rem 0}
.tab{padding:.4rem .8rem;border:1.5px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:var(--panel-2);cursor:pointer;font-weight:700;font-size:.9rem}
.tab.on{background:var(--panel);border-color:var(--line-2)}
.drawer .content{overflow:auto;padding:1rem;border-top:1.5px solid var(--line-2)}
dl.gloss{margin:0;display:grid;gap:.7rem}
dl.gloss dt{font-weight:700;font-family:var(--font-display);font-size:1.02rem}
dl.gloss dd{margin:0;font-size:.93rem;max-width:60ch}
.sources{margin:0;padding-left:1.1rem;display:grid;gap:.45rem;font-size:.9rem}

/* recap */
.recap{display:grid;gap:1.2rem;max-width:760px;padding-block:1rem}
.recap ul{margin:0;padding-left:1.1rem;display:grid;gap:.4rem}
.frontier{border-left:4px solid var(--accent);padding:.2rem 0 .2rem 1rem;display:grid;gap:.6rem;max-width:66ch}

/* sort level */
.sort-area{display:grid;gap:.8rem}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
@media (max-width:600px){.bins{grid-template-columns:1fr}}
.bin{min-height:120px;border:2px dashed var(--line-2);border-radius:var(--radius);padding:.5rem;display:grid;gap:.4rem;align-content:start;background:var(--panel)}
.bin.over{border-color:var(--accent);background:var(--accent-soft)}
.bin h4{margin:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.deck{display:flex;flex-wrap:wrap;gap:.5rem;min-height:56px}
.tcard{padding:.5rem .7rem;border:1.5px solid var(--line-2);border-radius:var(--radius);background:var(--panel-2);cursor:grab;font-size:.9rem;user-select:none;touch-action:none;position:relative}
.tcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tcard.placed{cursor:default;background:var(--panel);font-size:.85rem}
.tcard.placed small{display:block;color:var(--muted);font-size:.78rem}
.tcard.dragging{opacity:.85;z-index:60;pointer-events:none;position:fixed}
.tcard.shake{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.axioms{display:grid;gap:.4rem;margin:0;padding-left:1.1rem;font-size:.93rem}

/* predictions */
.theories{display:grid;gap:.5rem}
.theory{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.6rem .75rem;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--panel-2)}
.theory .nm{font-weight:700}
.theory .nm small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.theory .verdict{font-family:var(--font-mono);font-size:.85rem}

/* fx + toast */
.fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.04em;background:var(--energy-soft);color:var(--energy)}
.badge.flash{animation:flash .5s ease}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.done-panel{display:grid;gap:.8rem;padding:1rem;border:1.5px solid var(--good);border-radius:var(--radius);background:var(--panel)}
.stars-big{font-family:var(--font-mono);font-size:1.6rem;color:var(--warn);letter-spacing:.15em}
.kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-2);border-radius:4px;padding:0 .3rem;background:var(--panel-2)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="app" id="app">
  <header class="hud" id="hud" hidden>
    <div class="title"><small id="hud-eyebrow">Level 1 of 7</small><span id="hud-title">Paint a field</span></div>
    <div class="chips">
      <span class="chip">Score <b id="hud-score">0</b></span>
      <span class="chip">Streak <b id="hud-streak">0</b></span>
      <span class="chip">Time <b id="hud-timer">0:00</b></span>
    </div>
    <div class="tools">
      <button class="btn small on" id="btn-music" aria-pressed="true" title="Toggle music">Music</button>
      <button class="btn small on" id="btn-sfx" aria-pressed="true" title="Toggle sound effects">SFX</button>
      <button class="btn small" id="btn-notes" title="Open field notes">Notes</button>
      <button class="btn small" id="btn-map" title="Back to the map">Map</button>
    </div>
    <div class="progress" aria-hidden="true"><i id="hud-progress"></i></div>
  </header>
  <main id="main"></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Field notes and sources">
  <header><h3>Field notes</h3><button class="btn small" id="drawer-close">Close</button></header>
  <div class="tabs" role="tablist">
    <button class="tab on" role="tab" data-tab="gloss" id="tab-gloss">Glossary</button>
    <button class="tab" role="tab" data-tab="sources" id="tab-sources">Sources</button>
  </div>
  <div class="content" id="drawer-content"></div>
</aside>
<div id="overlay-root"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- utilities ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const wrapAngle = a => { a = a % TAU; if (a < 0) a += TAU; return a; };
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d <= -Math.PI) d += TAU; return d; };
const fmt = (v, d = 3) => Number.isFinite(v) ? v.toFixed(d) : '–';
const pct = v => Number.isFinite(v) ? (v * 100).toFixed(1) + '%' : '–';
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (v === true) node.setAttribute(k, '');
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

function fitCanvas(canvas, aspect, maxH = 560) {
  const parent = canvas.parentElement;
  const w = Math.max(240, Math.floor(parent.clientWidth || 600));
  let h = Math.round(w / aspect);
  if (h > maxH) h = maxH;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function canvasPos(canvas, e) {
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = canvas.width / dpr, h = canvas.height / dpr;
  return { x: (e.clientX - r.left) * w / r.width, y: (e.clientY - r.top) * h / r.height };
}
function theme() {
  return {
    bg: cssVar('--bg'), panel: cssVar('--panel'), panel2: cssVar('--panel-2'), fg: cssVar('--fg'), muted: cssVar('--muted'),
    line: cssVar('--line'), line2: cssVar('--line-2'), accent: cssVar('--accent'), energy: cssVar('--energy'), link: cssVar('--link'),
    good: cssVar('--good'), bad: cssVar('--bad'), warn: cssVar('--warn'), mono: cssVar('--font-mono') || 'monospace', body: cssVar('--font-body') || 'sans-serif'
  };
}
function withAlpha(color, a) {
  // accepts #rrggbb or rgb()/rgba(); returns rgba string
  color = color.trim();
  if (color.startsWith('#')) {
    const n = color.length === 4 ? color.slice(1).split('').map(c => c + c).join('') : color.slice(1);
    const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  const m = color.match(/[\d.]+/g);
  if (m && m.length >= 3) return `rgba(${m[0]},${m[1]},${m[2]},${a})`;
  return color;
}

/* ---------- audio engine (procedural spectral drone + synthesized SFX) ---------- */
const Audio = (() => {
  let ctx = null, master, comp, musicBus, sfxBus, noiseBuf;
  let musicOn = true, sfxOn = true;
  let drone = null, sched = null, nextBeat = 0, beat = 0, bar = 0;
  let brightness = 0.5, density = 0.4, root = 110, lastTick = 0;
  const ROOTS = [110, 130.81, 146.83, 164.81, 196.0];

    const ng = ctx.createGain(); ng.gain.value = 0;

  function changeRoot() {
    let r = pick(ROOTS); if (r === root) r = ROOTS[(ROOTS.indexOf(r) + 1) % ROOTS.length];
    root = r; const t = ctx.currentTime;
    drone.partials.forEach(p => { p.osc.frequency.cancelScheduledValues(t); p.osc.frequency.setValueAtTime(p.osc.frequency.value, t); p.osc.frequency.exponentialRampToValueAtTime(root * p.r * p.detune, t + 4); });
    drone.saw.frequency.cancelScheduledValues(t); drone.saw.frequency.setValueAtTime(drone.saw.frequency.value, t); drone.saw.frequency.exponentialRampToValueAtTime(root * 0.5, t + 4);
  }
  function bell(f, t, gain, decay, dest) {
    dest = dest || sfxBus;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + decay);

    [[1, 1], [2.76, 0.28], [5.4, 0.07]].forEach(([r, a]) => {

    if (beat % 4 === 0) { bar++; if (bar % 16 === 0) changeRoot(); }
    if (!musicOn) return;
    if (Math.random() < density) {
      const oct = Math.random() < 0.5 ? 2 : 4;
      const f = root * pick(PENTA) * oct;

    }
  }
  function env(g, t, a, d, peak) { const p = g.gain; p.cancelScheduledValues(t); p.setValueAtTime(0.0001, t); p.linearRampToValueAtTime(peak, t + a); p.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(type, f0, f1, t, a, d, peak) {

  const SFX = {

    unlock: t => { tone('sine', 440, 660, t, 0.01, 0.15, 0.14); tone('sine', 660, 990, t + 0.12, 0.01, 0.22, 0.14); },
    star: t => { tone('sine', 1568, 1568, t, 0.004, 0.25, 0.1); tone('sine', 2093, 2093, t + 0.05, 0.004, 0.3, 0.08); }

  function sfx(name) {

  }
  function setMusic(on) { musicOn = on; if (drone) drone.g.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.15); }
  function setSfx(on) { sfxOn = on; }
  function setBrightness(x) { brightness = clamp(x, 0, 1); if (drone) drone.filter.frequency.setTargetAtTime(lerp(380, 3400, brightness), ctx.currentTime, 0.25); }

  function setDensity(x) { density = clamp(x, 0, 1); }
  return { init, resume, sfx, setMusic, setSfx, setBrightness, setNoise, setDensity, get active() { return !!ctx; } };
})();

const FX = (() => {
  const canvas = $('#fx'); const ctx = canvas.getContext('2d'); let parts = []; let raf = 0;
  function size() { const dpr = Math.min(2, window.devicePixelRatio || 1); canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size(); addEventListener('resize', size);
  function burst(x, y, color, n = 24) {
    if (reduceMotion()) n = Math.min(n, 6);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 80 + Math.random() * 220;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.7 + Math.random() * 0.5, t: 0, color, r: 2 + Math.random() * 3 });
    }
    if (!raf) raf = requestAnimationFrame(step);
  }
  let last = 0;
  function step(ts) {
    const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.t < p.life);
    for (const p of parts) {
      p.t += dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.r, p.r);
    }
    ctx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(step); else { raf = 0; last = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function burstAt(elm, color, n) { const r = elm.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, color, n); }
  return { burst, burstAt };
})();

const LEVELS = [
  {
    id: 'field', title: 'Paint a field', topic: 'Fields and the action',
    card: `A field is a number at every point. The action scores a whole configuration at once: neighbors that disagree cost action, and so does sitting away from the two valleys of the potential at φ = ±1. Quantum field theory weighs every configuration by e<sup>−S</sup>.`,
    goal: `Goal 1: paint the grid down to an action below 1. Goal 2: build a wall between a +1 region and a −1 region and read what it costs.`,
    deeper: `<p>In classical mechanics the action S is the time integral of the Lagrangian, and the path a system actually takes makes S stationary. Feynman's 1948 formulation of quantum mechanics keeps every path and weights it by the phase e<sup>iS/ħ</sup>. Rotating time to imaginary values (the Wick rotation) turns that oscillating phase into a real, decaying weight e<sup>−S<sub>E</sub></sup>, with S<sub>E</sub> the Euclidean action. The quantum theory then becomes a problem in statistical mechanics: a probability distribution over field configurations, exactly like a Boltzmann factor e<sup>−E/kT</sup>.</p>
<p>The action on this board is a lattice version of the Euclidean φ⁴ action. The gradient term ½(φ(x+μ) − φ(x))² penalizes disagreement between neighbors; the potential (λ/4)(φ² − 1)² has two valleys at φ = ±1. Those valleys are the vacua. A configuration has to pick one, and either pick breaks the symmetry φ → −φ of the action itself: spontaneous symmetry breaking. A wall between a +1 region and a −1 region costs action proportional to its length, which is why large uniform domains dominate the sum. Shrink the lattice spacing to zero while adjusting λ so that physical quantities stay fixed and you have a quantum field theory, if the limit exists.</p>`,
    questions: [
      { q: 'Which configuration has the lowest action?', opts: ['φ = +1 everywhere', 'φ alternating +1, −1, +1, −1 between neighbors', 'φ = 0 everywhere'], a: 0, why: 'A uniform field in a valley has zero gradient cost and zero potential cost. Alternating signs maximize the gradient term; φ = 0 sits on top of the potential barrier.' },
      { q: 'Doubling the action S does what to the weight e^−S?', opts: ['Halves it', 'Squares it', 'Leaves it unchanged'], a: 1, why: 'e^−2S = (e^−S)². Large-action configurations are suppressed exponentially, not linearly.' },
      { q: 'A wall between a +1 region and a −1 region costs action because', opts: ['inside the wall the field is far from both valleys and changes quickly', 'the field must vanish at infinity', 'λ becomes negative in the wall'], a: 0, why: 'Crossing from +1 to −1 forces large neighbor differences and passes through the potential barrier at φ = 0. Both terms charge for it.' }

  {
    id: 'gauge', title: 'Spin the gauge', topic: 'Gauge invariance',
    card: `Every link carries a phase, drawn as an arrow. Around each small square, the plaquette, the phases add up to a curvature. Spin all the links at one site together: the arrows change but every plaquette stays put. Gauge symmetry is a redundancy in the description. The physics lives in the plaquettes.`,
    goal: `Goal: perform three gauge transformations in the sandbox, then solve three matching puzzles using only gauge moves. One puzzle has no solution. Say so.`,
    deeper: `<p>Hermann Weyl proposed in 1918 that physical law should not change when a local standard of length is redefined point by point; by 1929 the idea had taken its modern form, that electromagnetism is the theory of a local phase, a U(1) gauge symmetry. Yang and Mills generalized the phase to a matrix from a non-abelian group in 1954. The strong and weak interactions turned out to be exactly this kind of theory.</p>
<p>On Wilson's lattice the gauge field lives on links as group elements, here a phase e<sup>iθ</sup>. Carrying a charge around a plaquette multiplies its wavefunction by e<sup>iθ<sub>P</sub></sup>. The plaquette angle θ<sub>P</sub> is the lattice version of the field strength F<sub>μν</sub>, the curvature of a connection; for a smooth field θ<sub>P</sub> ≈ a²F<sub>μν</sub>. A gauge transformation changes the description, not the physics, so anything measurable must be gauge invariant: plaquettes, Wilson loops, and correlations of such objects. On an open square lattice two configurations with identical plaquettes are always gauge equivalent. On a torus there are extra invariants, the holonomies around the two non-contractible cycles, so matching plaquettes is necessary but not sufficient there.</p>`,
    questions: [
      { q: 'After a gauge transformation at one site, what changes?', opts: ['The plaquettes around that site', 'The links touching that site', 'Nothing at all'], a: 1, why: 'Only the four links at that site change. Going around any neighbouring plaquette you enter the site along one link and leave along another; the gauge change adds −α on the way in and +α on the way out, so the plaquette sum is untouched.' },
      { q: 'Which of these could be a physical observable?', opts: ['A single link angle θ', 'A plaquette angle, or a Wilson loop', 'The gauge parameter α'], a: 1, why: 'Observables must not depend on the choice of gauge. Link angles and α are description, not physics.' },
      { q: 'On an open square lattice, two configurations with identical plaquettes everywhere are', opts: ['always related by a gauge transformation', 'never related by a gauge transformation', 'related only if their links already match'], a: 0, why: 'On a simply connected lattice the plaquettes determine the configuration up to gauge. On a torus you would also need the two holonomies.' }
    ]
  },
  {
    id: 'mc', title: 'Run the lattice', topic: 'Monte Carlo and the continuum limit',
    card: `The path integral sums over all configurations. Nobody can list them, but you can sample them with the right probabilities, and Metropolis does exactly that. Wilson's lattice turned quantum field theory into statistical mechanics you can run on a laptop.`,
    goal: `Goal: let the running average of ⟨cos θ<sub>P</sub>⟩ settle, then record it within 2% of the exact value at three different couplings β, at least 0.8 apart.`,
    deeper: `<p>Kenneth Wilson's 1974 paper replaced continuous spacetime by a grid with spacing a, put the gauge field on links and the action on plaquettes, and observed that the resulting Euclidean path integral is an ordinary, if enormous, statistical-mechanics sum. The Metropolis algorithm (Metropolis, Rosenbluth, Rosenbluth, Teller and Teller, 1953) samples that sum: propose a local change, accept it with probability min(1, e<sup>−ΔS</sup>), repeat. Averages over the samples converge to expectation values.</p>
<p>In two dimensions the plaquette angles of U(1) theory become independent variables after a change of coordinates, so the one-plaquette integral gives ⟨cos θ<sub>P</sub>⟩ = I₁(β)/I₀(β) exactly, with I<sub>n</sub> the modified Bessel functions. That is the curve your measurements are compared against. Large β is weak coupling: the weight e<sup>−β(1 − cos θ)</sup> pins plaquettes near zero curvature and the lattice begins to look like a smooth continuum field. The continuum limit means a → 0 with couplings tuned so that physical masses stay fixed; in an asymptotically free theory that is the limit β → ∞.</p>
<p>The same logic, with SU(3) matrices on links and quarks added, is lattice QCD. The Budapest–Marseille–Wuppertal collaboration computed the masses of the light hadrons from first principles to a few percent (Science, 2008). Every such computation assumes that the continuum limit exists and defines a quantum field theory obeying the axioms. Proving that for four-dimensional Yang–Mills theory is the "existence" half of the Clay Millennium problem.</p>`,
    questions: [
      { q: 'Large β means', opts: ['strong coupling and disordered plaquettes', 'weak coupling, plaquettes near zero, closer to the continuum', 'high temperature'], a: 1, why: 'β multiplies the action, so large β makes curvature expensive. Plaquettes freeze near zero and ⟨cos θ_P⟩ → 1.' },
      { q: 'The Metropolis rule accepts a change that raises the action', opts: ['never', 'always', 'with probability e^−ΔS'], a: 2, why: 'Accepting uphill moves with probability e^−ΔS is what makes the samples follow the Boltzmann weight instead of sliding to the minimum.' },
      { q: '⟨cos θ_P⟩ approaches 1 as β → ∞ because', opts: ['the weight concentrates on flat, zero-curvature configurations', 'the lattice gets smaller', 'the number of plaquettes grows'], a: 0, why: 'At large β only configurations with θ_P ≈ 0 carry weight, and cos 0 = 1. The exact curve I₁(β)/I₀(β) → 1 says the same thing.' }
    ]
  },
  {
    id: 'loops', title: 'Loop the loop', topic: 'Wilson loops and confinement',
    card: `Drag a rectangle on the lattice to measure a Wilson loop. It tells you the energy of two static charges held apart by that loop. If −ln W grows with the area of the loop, the energy grows with distance and the charges can never be pulled apart. That is confinement.`,
    goal: `Goal: measure at least three different loop areas and fit the string tension σ to within 10% of the exact value.`,
    deeper: `<p>Wilson's confinement criterion: let W(C) be the expectation of the phase (or trace) accumulated around a closed loop C. For a rectangle of width R and time extent T, −ln W ≈ T·V(R) for large T, where V(R) is the energy of two static opposite charges held a distance R apart. If W obeys an area law, −ln W ≈ σ·R·T, then V(R) = σR grows linearly without bound: the charges are confined, and σ is the string tension. If W obeys a perimeter law, −ln W ≈ c·(R + T), the energy saturates and the charges can be separated: deconfinement.</p>
<p>In two-dimensional U(1) theory the plaquettes are independent, so the loop expectation factorizes into one factor of I₁(β)/I₀(β) per enclosed plaquette, and the area law is exact for every β. Four dimensions is richer. Compact U(1) lattice theory confines at strong coupling but has a Coulomb phase at weak coupling (Guth 1980; Fröhlich and Spencer 1982), which is why free photons exist in the continuum limit. For SU(3), lattice computations show an area law at every coupling studied, with a string tension of roughly (440 MeV)² in physical units. Confinement in four-dimensional non-abelian gauge theory is established numerically but has never been proven.</p>`,
    questions: [
      { q: 'An area law for Wilson loops means the energy between two static charges grows', opts: ['linearly with their separation', 'like 1/r', 'not at all'], a: 0, why: '−ln W ≈ σRT = T·V(R) gives V(R) = σR: a string with constant tension σ connects the charges.' },
      { q: 'In 2D U(1) lattice gauge theory, −ln W equals', opts: ['σ times the area, exactly', 'σ times the perimeter', 'a constant'], a: 0, why: 'Each enclosed plaquette contributes an independent factor I₁(β)/I₀(β), so −ln W = Area × (−ln(I₁/I₀)).' },
      { q: 'A perimeter law indicates', opts: ['confinement', 'deconfinement: the charges can be separated at finite energy', 'a mass gap'], a: 1, why: 'If −ln W grows only with the perimeter, V(R) tends to a constant and the charges come apart.' }

  {
    id: 'running', title: 'Zoom the coupling', topic: 'Renormalization and asymptotic freedom',
    card: `Couplings depend on the energy at which you look. Predict for each theory: zoom in to higher energy, does the coupling shrink or grow? For the strong force it shrinks. That asymptotic freedom is the reason a continuum limit of Yang–Mills is expected to exist at all.`,
    goal: `Goal: predict the direction for all three theories, then scrub the energy slider to read off the one-loop couplings.`,
    deeper: `<p>Coupling constants are not constant. When a measurement probes a shorter distance, the quantum fluctuations it averages over change, and the effective coupling changes with the energy scale μ. The rate is the beta function. At one loop in SU(3) gauge theory with n<sub>f</sub> flavors of quarks, μ dα<sub>s</sub>/dμ = −(b₀/2π) α<sub>s</sub>² with b₀ = 11 − 2n<sub>f</sub>/3, so α<sub>s</sub>(μ) = α<sub>s</sub>(μ₀) / [1 + (b₀/2π) α<sub>s</sub>(μ₀) ln(μ/μ₀)]. For n<sub>f</sub> ≤ 16 the coefficient is positive and the coupling shrinks at high energy: asymptotic freedom, found by Gross and Wilczek and by Politzer in 1973 (Nobel Prize, 2004). David Gross, who leads the group examining OpenAI's physics claim, is that Gross.</p>
<p>In QED the sign is reversed. The coupling grows with energy and, extrapolated at one loop, diverges at the Landau pole, far beyond the Planck scale but a sign that QED on its own may not define a consistent continuum theory. Scalar φ⁴ theory in four dimensions behaves the same way, and in 2021 Aizenman and Duminil-Copin proved that the lattice φ⁴ and Ising models in four dimensions are trivial: their continuum limits are free, non-interacting fields. That is why the Higgs sector by itself is not expected to be a continuum theory, and why a "completion" of the Standard Model, a theory that reduces to it at low energy yet exists at all scales, is a nontrivial mathematical target rather than a formality.</p>`,
    questions: [
      { q: 'Asymptotic freedom means the coupling', opts: ['grows at high energy', 'shrinks at high energy', 'does not depend on energy'], a: 1, why: 'With b₀ > 0 the one-loop coupling falls like 1/ln(μ). Quarks behave almost freely when probed at short distances.' },
      { q: 'In SU(3) with n_f quark flavors, b₀ = 11 − 2n_f/3. Asymptotic freedom is lost when', opts: ['n_f ≥ 17', 'n_f ≥ 6', 'it is never lost'], a: 0, why: 'b₀ turns negative once 2n_f/3 > 11, that is n_f ≥ 17. Real QCD has 6 flavors.' },
      { q: 'A Landau pole in QED suggests that', opts: ['QED by itself is probably not a complete continuum theory', 'electrons are massless', 'photons are confined'], a: 0, why: 'A coupling that diverges at finite energy signals that the theory needs a different completion at short distances, or is trivial as a continuum theory.' }

  {
    id: 'sort', title: 'Sort the theories', topic: 'Constructive quantum field theory',
    card: `"Existence" is a precise claim: a theory that satisfies a list of axioms. Sort nine theories into what has been built, what is known to collapse to a free theory, and what is still open. In four dimensions no interacting theory has ever been rigorously built.`,
    goal: `Goal: place all nine cards. Mistakes bounce back with a one-line reason.`,
    deeper: `<p>Arthur Wightman's axioms (1956) say what a relativistic quantum field theory is: a Hilbert space carrying a unitary representation of the Poincaré group with positive energy and a unique vacuum, and operator-valued distributions that commute at spacelike separation. Osterwalder and Schrader (1973, with a growth condition added in 1975) translated this into conditions on Euclidean correlation functions: Euclidean invariance, reflection positivity, permutation symmetry, the cluster property and a regularity bound. Satisfy those and a Wightman theory can be reconstructed.</p>
<p>Constructive quantum field theory is the program of building theories that satisfy these axioms. Nelson, Glimm and Jaffe built interacting scalar theories in two dimensions in the late 1960s and early 1970s; Glimm and Jaffe, then Feldman and Osterwalder, built φ⁴ in three dimensions from 1973 on. Two-dimensional Yang–Mills is exactly solvable. In four dimensions the only interacting candidates with a chance are asymptotically free gauge theories, and the closest anyone came was Tadeusz Balaban's series of papers in the 1980s proving ultraviolet stability bounds for four-dimensional lattice Yang–Mills; the continuum limit was never completed. More recently Chandra, Chevyrev, Hairer and Shen (2022) made rigorous progress on three-dimensional Yang–Mills through stochastic quantization.</p>`,

      { q: 'Reflection positivity of the Euclidean theory gives, after reconstruction,', opts: ['a Hilbert space with positive norm', 'a Landau pole', 'confinement'], a: 0, why: 'Reflection positivity is the Euclidean shadow of positivity of the inner product. Without it there is no quantum theory to reconstruct.' },

  window.scrollTo(0, 0);
}

/* level */
function showLevel(i) {
  teardown(); i = clamp(i | 0, 0, 6); state.screen = 'level'; state.level = i; hud.hidden = false; setHUD();
  const lv = LEVELS[i];
  $('#hud-eyebrow').textContent = `Level ${i + 1} of 7 · ${lv.topic}`; $('#hud-title').textContent = lv.title; $('#hud-progress').style.width = '0%';
  main.innerHTML = '';
  const board = el('div', { class: 'board' }); const status = el('div', { class: 'status', role: 'status' });
  const extra = el('div', { style: 'display:grid;gap:.7rem;min-width:0' });
  const side = el('div', { class: 'side' },
    el('div', { class: 'card' }, el('div', { class: 'eyebrow' }, `Level ${i + 1} · ${lv.topic}`), el('h2', {}, lv.title), el('p', { html: lv.card }), el('div', { class: 'goal', html: lv.goal })),
    el('details', { class: 'deeper' }, el('summary', {}, 'Deeper'), el('div', { class: 'body', html: lv.deeper })),
    extra);
  main.append(el('div', { class: 'level' }, board, side));
  let completedFlag = false;
  const api = {
    board, side: extra,
    status(t, kind) { status.textContent = t; status.className = 'status' + (kind ? ' ' + kind : ''); },
    progress(f) { $('#hud-progress').style.width = (clamp(f, 0, 1) * 100).toFixed(1) + '%'; },
    complete(stars) { if (completedFlag) return; completedFlag = true; onComplete(i, clamp(stars | 0, 1, 3)); },
    sfx: n => Audio.sfx(n), burstAt: (elm, color, n) => FX.burstAt(elm, color, n), toast
  };
  const impl = LEVEL_IMPL[i](api); board.append(status);
  current = { impl, api, idx: i };
  state.levelStart = Date.now(); clearInterval(timerInt);
  timerInt = setInterval(() => { const s = Math.floor((Date.now() - state.levelStart) / 1000); $('#hud-timer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 1000);
  $('#hud-timer').textContent = '0:00';
  window.scrollTo(0, 0);
}

async function onComplete(i, stars) {
  Audio.sfx('fanfare'); FX.burst(innerWidth / 2, innerHeight / 3, cssVar('--accent'), 60); FX.burst(innerWidth / 2, innerHeight / 3, cssVar('--energy'), 40);
  const gained = 100 + 50 * stars; state.score += gained; state.stars[i] = Math.max(state.stars[i], stars); state.completed[i] = true; save(); setHUD();
  await sleep(700);
  const res = await runCheck(LEVELS[i].questions, LEVELS[i].title);
  save(); setHUD();
  if (i < 6) showDone(i, stars, gained, res); else showRecap(res);
}

function runCheck(questions, title) {
  return new Promise(resolve => {
    let k = 0, correct = 0; const dlg = el('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Quick check' });
    const shuffleIdx = (n) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const overlay = el('div', { class: 'overlay' }, dlg); overlayRoot.innerHTML = ''; overlayRoot.append(overlay);
    function render() {
      const q = questions[k]; dlg.innerHTML = '';
      const count = el('div', { class: 'count' }, `Quick check · ${title} · question ${k + 1} of ${questions.length}`);
      const fb = el('div', { class: 'feedback' }); const next = el('button', { class: 'btn primary', hidden: true, onclick: () => { Audio.sfx('click'); k++; if (k < questions.length) render(); else { overlayRoot.innerHTML = ''; resolve({ correct, total: questions.length }); } } }, k + 1 < questions.length ? 'Next question' : 'Finish');
      const perm = shuffleIdx(q.opts.length);
      const opts = perm.map((orig, j) => el('button', { class: 'opt', onclick: () => {
        if (next.hidden === false) return;
        const ok = orig === q.a; $$('.opt', dlg).forEach((b, jj) => { b.disabled = true; if (perm[jj] === q.a) b.classList.add('correct'); else if (jj === j) b.classList.add('wrong'); });
        if (ok) { correct++; state.score += 50; state.streak++; Audio.sfx('good'); FX.burstAt(opts[j], cssVar('--good'), 14); fb.textContent = 'Correct. ' + q.why; fb.className = 'feedback good'; }
        else { state.streak = 0; Audio.sfx('bad'); fb.textContent = 'Not quite. ' + q.why; fb.className = 'feedback bad'; }
        setHUD(); next.hidden = false; next.focus();
      } }, q.opts[orig]));
      dlg.append(count, el('div', { class: 'q' }, q.q), el('div', { class: 'options' }, ...opts), fb, el('div', { class: 'btn-row' }, next));
      opts[0].focus();
      if (window.__game && window.__game.auto) setTimeout(() => { opts[perm.indexOf(q.a)].click(); setTimeout(() => next.click(), 30); }, 30);
    }
    render();
  });
}

function showDone(i, stars, gained, res) {
  const dlg = el('div', { class: 'dialog done-panel', role: 'dialog', 'aria-modal': 'true' },
    el('div', { class: 'eyebrow' }, `Level ${i + 1} complete`), el('h2', {}, LEVELS[i].title),
    el('div', { class: 'stars-big', 'aria-label': `${stars} of 3 stars` }, starStr(stars)),
    el('p', {}, `+${gained} for the level, +${res.correct * 50} for ${res.correct} of ${res.total} quick-check answers. Score ${state.score}.`),
    el('div', { class: 'btn-row' },
      el('button', { class: 'btn primary', onclick: () => { Audio.sfx('click'); showLevel(i + 1); } }, i + 1 === 6 ? 'On to the boss' : 'Next level'),
      el('button', { class: 'btn', onclick: () => { Audio.sfx('click'); showMap(); } }, 'Back to the map')));
  overlayRoot.innerHTML = ''; overlayRoot.append(el('div', { class: 'overlay' }, dlg)); $('.btn.primary', dlg).focus();
}

function showRecap(res) {
  teardown(); state.screen = 'recap'; hud.hidden = false; setHUD();
  $('#hud-eyebrow').textContent = 'Boss cleared'; $('#hud-title').textContent = 'What you now understand'; $('#hud-progress').style.width = '100%'; $('#hud-timer').textContent = '–';
  main.innerHTML = '';
  main.append(el('section', { class: 'recap' },
    el('div', {}, el('div', { class: 'eyebrow' }, `Final score ${state.score} · stars ${state.stars.reduce((a, b) => a + b, 0)} of 21`), el('h2', {}, 'What you now understand')),
    el('ul', {}, ...RECAP.map(r => el('li', {}, r))),
    el('h2', {}, 'Where the frontier is'),
    el('div', { class: 'frontier', html: FRONTIER }),
    el('div', { class: 'btn-row' }, el('button', { class: 'btn primary', onclick: () => { Audio.sfx('click'); showMap(); } }, 'Back to the map'), el('button', { class: 'btn', onclick: () => { Audio.sfx('click'); openDrawer('gloss'); } }, 'Open the field notes'))));
  if (res && res.correct === res.total) toast('Perfect quick check on the boss.');
  window.scrollTo(0, 0);
}

/* drawer */
const drawer = $('#drawer'), drawerContent = $('#drawer-content');
function renderDrawer(tab) {
  $$('.tab', drawer).forEach(t => t.classList.toggle('on', t.dataset.tab === tab)); drawerContent.innerHTML = '';
  if (tab === 'gloss') { const dl = el('dl', { class: 'gloss' }); GLOSSARY.forEach(([t, d]) => dl.append(el('dt', {}, t), el('dd', {}, d))); drawerContent.append(dl); }
  else drawerContent.append(el('p', { class: 'muted', style: 'margin-bottom:.6rem;font-size:.9rem' }, 'Primary literature behind the levels. The OpenAI physics manuscripts are not public; everything said about them here comes from the announcement as relayed by secondary coverage.'), el('ol', { class: 'sources' }, ...SOURCES.map(s => el('li', {}, s))));
}
function openDrawer(tab = 'gloss') { renderDrawer(tab); drawer.hidden = false; $('#drawer-close').focus(); }
$('#drawer-close').addEventListener('click', () => { Audio.sfx('click'); drawer.hidden = true; });
$$('.tab', drawer).forEach(t => t.addEventListener('click', () => { Audio.sfx('click'); renderDrawer(t.dataset.tab); }));
$('#btn-notes').addEventListener('click', () => { Audio.sfx('click'); openDrawer('gloss'); });
$('#btn-map').addEventListener('click', () => { Audio.sfx('click'); showMap(); });
$('#btn-music').addEventListener('click', () => { state.music = !state.music; if (state.music) ensureAudio(); else syncAudio(); save(); setHUD(); Audio.sfx('click'); });
$('#btn-sfx').addEventListener('click', () => { state.sfx = !state.sfx; if (state.sfx) ensureAudio(); else syncAudio(); save(); setHUD(); Audio.sfx('click'); });
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!drawer.hidden) drawer.hidden = true; } });
let resizeT = 0; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (current && current.impl && current.impl.resize) current.impl.resize(); }, 120); });
addEventListener('pointerdown', () => { if (Audio.active) Audio.resume(); }, { passive: true });

/* debug + hot update + boot */
window.__game = { gotoLevel: i => showLevel(i), completeLevel: () => current && current.api && current.api.complete(3), get state() { return state; }, auto: false, showMap, showTitle, showRecap: () => showRecap({ correct: 6, total: 6 }), Bessel, Lattice, OpenLattice, get current() { return current; } };
function start(data) {
  load(); setHUD();
  if (data && data.screen === 'level' && Number.isInteger(data.level)) showLevel(data.level);
  else if (data && data.screen === 'map') showMap();
  else showTitle();
}
try { window.claude?.hot?.snapshot?.(() => ({ screen: state.screen, level: state.level })); } catch (e) { /* no-op */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
